name: A11yForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi==0.117.1 pydantic==2.12.0 playwright==1.55.0 reportlab==5.0.1
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check frontend JavaScript
        run: node --check frontend/app.js
      - name: Tests
        run: python -m pytest -q
      - name: Adversarial simulation
        run: python simulations/run_lab.py
