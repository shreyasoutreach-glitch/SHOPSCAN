name: A11yForge Scheduled Monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: a11yforge-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A11YFORGE_INTERNAL_URL: ${{ secrets.A11YFORGE_INTERNAL_URL }}
      A11YFORGE_MONITOR_SECRET: ${{ secrets.A11YFORGE_MONITOR_SECRET }}
    steps:
      - name: Check monitoring configuration
        run: |
          if [ -z "$A11YFORGE_INTERNAL_URL" ] || [ -z "$A11YFORGE_MONITOR_SECRET" ]; then
            echo "Monitoring is disabled until A11YFORGE_INTERNAL_URL and A11YFORGE_MONITOR_SECRET are configured."
            echo "No monitoring request was attempted."
            exit 0
          fi

      - name: Run due monitoring targets
        if: env.A11YFORGE_INTERNAL_URL != '' && env.A11YFORGE_MONITOR_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error --max-time 900 \
            -X POST "$A11YFORGE_INTERNAL_URL/api/monitor/run-due" \
            -H "X-A11yForge-Monitor-Secret: $A11YFORGE_MONITOR_SECRET"
