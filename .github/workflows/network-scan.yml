name: A11yForge corpus + adversarial verification

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: shopscan-corpus
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        sprint: [sprint2, sprint3, sprint4, sprint5]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser verifier
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rendered.txt pytest==8.4.2
          python -m playwright install --with-deps chromium
      - name: Run unit and repair tests
        run: python -m pytest -q tests/test_rendered.py tests/test_repair.py tests/test_adversarial.py
      - name: Capture test diagnostics
        if: always()
        run: |
          mkdir -p out
          python -m pytest -vv tests/test_rendered.py tests/test_repair.py tests/test_adversarial.py > out/pytest.log 2>&1 || true
          cat out/pytest.log
      - name: Run adversarial simulation lab
        run: python simulations/run_lab.py
      - name: Run ShopScan
        env:
          SHOPSCAN_DOMAINS: corpus/${{ matrix.sprint }}.txt
          SHOPSCAN_WORKERS: "4"
          SHOPSCAN_DELAY: "1.5"
          SHOPSCAN_MAX_BYTES: "3000000"
          SHOPSCAN_RENDERED: "playwright"
          SHOPSCAN_RENDER_TIMEOUT_MS: "20000"
          SHOPSCAN_RENDER_SETTLE_MS: "1000"
        run: python network_runner.py
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopscan-results-${{ matrix.sprint }}-${{ github.run_id }}
          path: out/
          retention-days: 14
