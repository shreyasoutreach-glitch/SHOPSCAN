name: ShopScan network scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ShopScan
        env:
          SHOPSCAN_WORKERS: "4"
          SHOPSCAN_DELAY: "2"
          SHOPSCAN_MAX_BYTES: "3000000"
        run: python network_runner.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: shopscan-results-${{ github.run_id }}
          path: out/
          retention-days: 14
