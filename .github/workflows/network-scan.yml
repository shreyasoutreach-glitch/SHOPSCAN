name: ShopScan network scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser verifier
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rendered.txt pytest==8.4.2
          python -m playwright install --with-deps chromium
      - name: Run rendered unit tests
        run: python -m pytest -q tests/test_rendered.py
      - name: Run ShopScan
        env:
          SHOPSCAN_WORKERS: "2"
          SHOPSCAN_DELAY: "2"
          SHOPSCAN_MAX_BYTES: "3000000"
          SHOPSCAN_RENDERED: "playwright"
          SHOPSCAN_RENDER_TIMEOUT_MS: "20000"
          SHOPSCAN_RENDER_SETTLE_MS: "1200"
        run: python network_runner.py
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: shopscan-results-${{ github.run_id }}
          path: out/
          retention-days: 14
