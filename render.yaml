services:
  - type: web
    name: a11yforge-api-docker
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: A11YFORGE_CORS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: A11YFORGE_CRAWL_PAGES
        value: "4"
      - key: A11YFORGE_RATE_LIMIT
        value: "12"
